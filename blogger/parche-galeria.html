<!--
  Pegá este bloque en Blogger, justo ANTES de </body>.
  Tema → Personalizar → Editar HTML (o Tema → Editar HTML).

  En la ficha (#/auto/...) la foto grande se muestra completa
  (object-fit: contain) en vez de recortarse arriba y abajo.
-->
<style id="gyg-fotos-enteras">
  /* Recuadros típicos de la galería de la ficha */
  .gallery-main img,
  .gallery-stage img,
  .photo-stage img,
  .media-main img,
  .hero-photo img {
    object-fit: contain !important;
    object-position: center center !important;
    background: #111827;
  }
</style>
<script>
(function () {
  function esFicha() {
    return /#\/auto\//.test(location.hash || "");
  }

  function aplicar() {
    var ficha = esFicha();
    var imgs = document.querySelectorAll("img");
    for (var i = 0; i < imgs.length; i++) {
      var img = imgs[i];
      var grande = img.clientWidth >= 240 && img.clientHeight >= 180;
      if (ficha && grande) {
        img.style.setProperty("object-fit", "contain", "important");
        img.style.setProperty("object-position", "center", "important");
        if (img.parentElement) {
          img.parentElement.style.backgroundColor = "#111827";
        }
      }
    }
  }

  var t;
  function programar() {
    clearTimeout(t);
    t = setTimeout(aplicar, 60);
  }

  window.addEventListener("hashchange", programar);
  window.addEventListener("load", programar);
  document.addEventListener("DOMContentLoaded", programar);
  try {
    new MutationObserver(programar).observe(document.documentElement, {
      childList: true,
      subtree: true,
    });
  } catch (_err) {}
  programar();
})();
</script>
