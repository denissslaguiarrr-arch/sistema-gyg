<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-brand-title="Ingresar">Ingresar</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 p-6">
    <img data-brand-logo alt="" class="hidden h-12 w-auto max-w-[240px] object-contain mb-4" />
    <div data-brand-wordmark class="marca-wordmark mb-4">Concesionaria</div>
    <h1 class="text-xl font-bold text-slate-900 mb-1">Panel de administración</h1>
    <p class="text-sm text-slate-500 mb-6"><span data-brand-name>Concesionaria</span> — acceso interno</p>

    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Usuario</label>
        <input id="l-username" required autocomplete="username" class="campo" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Contraseña</label>
        <input id="l-password" type="password" required autocomplete="current-password" class="campo" />
      </div>
      <div id="login-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition"
      >
        Ingresar
      </button>
    </form>
  </div>

  <style>
    .marca-wordmark {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 800;
      font-size: 1.75rem;
      letter-spacing: 0.06em;
      line-height: 1;
      color: #0e1116;
    }
    .marca-sep {
      color: #e85d23;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 700;
    }
    .campo {
      width: 100%;
      border: 1px solid rgb(203 213 225);
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
    }
    .campo:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgb(165 180 252);
      border-color: rgb(129 140 248);
    }
  </style>

  <script src="brand.js"></script>
  <script src="login.js"></script>
</body>
</html>
